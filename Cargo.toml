[workspace]
resolver = "2"
members = ["crates/*", "xtask"]
default-members = [
    "crates/editor-model",
    "crates/editor-store",
    "crates/editor-commands",
    "crates/editor-formats",
    "crates/editor-blocks",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
editor-model = { path = "crates/editor-model" }
editor-store = { path = "crates/editor-store" }
editor-commands = { path = "crates/editor-commands" }
editor-formats = { path = "crates/editor-formats" }
editor-blocks = { path = "crates/editor-blocks" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 1
